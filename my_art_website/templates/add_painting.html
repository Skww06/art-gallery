<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Artwork</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="border-b border-stone-200 py-6 px-8 flex justify-between items-center bg-white">
        <h1 class="text-2xl font-light tracking-wide">Art Studio Gallery</h1>
        <nav class="space-x-6 text-sm text-stone-600">
            <a href="/" class="hover:text-stone-900">Gallery</a>
            <a href="/add" class="font-medium text-stone-900 underline">Add Artwork</a>
        </nav>
    </header>

    <!-- Upload Form Section -->
    <main class="max-w-xl mx-auto py-12 px-6">
        <div class="bg-white p-8 rounded-lg shadow-sm border border-stone-200">
            <h2 class="text-2xl font-light mb-6 text-stone-800">Add New Artwork</h2>

            <form action="/add" method="POST" enctype="multipart/form-data" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Painting Title</label>
                    <input type="text" name="title" required placeholder="e.g. Sunset Horizons" class="w-full border border-stone-300 rounded p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-stone-800">
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Medium</label>
                    <input type="text" name="medium" required placeholder="e.g. Oil on Canvas" class="w-full border border-stone-300 rounded p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-stone-800">
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Dimensions</label>
                    <input type="text" name="dimensions" required placeholder='e.g. 24" x 36"' class="w-full border border-stone-300 rounded p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-stone-800">
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Price ($ USD)</label>
                    <input type="number" step="0.01" name="price_dollars" required placeholder="550.00" class="w-full border border-stone-300 rounded p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-stone-800">
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Artwork Photo</label>
                    <input type="file" name="image_file" accept="image/*" required class="w-full text-sm text-stone-600 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-stone-900 file:text-white hover:file:bg-stone-700">
                </div>

                <div class="pt-4 flex items-center justify-between">
                    <a href="/" class="text-sm text-stone-500 hover:text-stone-800">Cancel</a>
                    <button type="submit" class="bg-stone-900 text-white px-6 py-2.5 text-sm rounded hover:bg-stone-700 font-medium">Upload Artwork</button>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 font-medium mb-1">Artwork Description</label>
                    <textarea name="description" rows="3" placeholder="Describe the backstory, inspiration, brushwork, or materials used..."
                            class="w-full bg-stone-50 border border-stone-200 p-3 text-sm focus:outline-none focus:border-stone-900 rounded"></textarea>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
