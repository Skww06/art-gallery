<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Login — Gallery Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, .font-serif-editorial { font-family: 'Cormorant Garamond', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex items-center justify-center p-6 selection:bg-stone-200">

    <div class="bg-white p-10 shadow-sm border border-stone-200 max-w-md w-full">
        <div class="text-center mb-8">
            <p class="text-xs uppercase tracking-widest text-stone-400 font-medium mb-1">Restricted Access</p>
            <h1 class="font-serif-editorial text-4xl text-stone-900">Studio Login</h1>
        </div>

        {% if error %}
        <div class="mb-6 p-3 bg-red-50 border border-red-200 text-red-600 text-xs tracking-wide text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-wider text-stone-500 font-medium mb-1.5">Username</label>
                <input type="text" name="username" required class="w-full bg-stone-50 border border-stone-200 px-4 py-3 text-sm focus:outline-none focus:border-stone-900 focus:bg-white transition rounded-none">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-stone-500 font-medium mb-1.5">Password</label>
                <input type="password" name="password" required class="w-full bg-stone-50 border border-stone-200 px-4 py-3 text-sm focus:outline-none focus:border-stone-900 focus:bg-white transition rounded-none">
            </div>

            <button type="submit" class="w-full bg-stone-900 text-white py-3.5 text-xs tracking-widest uppercase font-medium hover:bg-stone-800 transition shadow-sm mt-2">
                Authorize Session &rarr;
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="/" class="text-xs uppercase tracking-widest text-stone-400 hover:text-stone-900 transition">&larr; Return to Gallery</a>
        </div>
    </div>

</body>
</html>
