<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Your Purchase!</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-lg shadow-sm border border-stone-200 max-w-md w-full text-center">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            ✓
        </div>
        <h1 class="text-2xl font-light text-stone-800 mb-2">Thank You!</h1>
        <p class="text-stone-600 text-sm mb-6">Your order for <strong class="text-stone-900">{{ painting.title }}</strong> has been confirmed. The studio will prepare your original artwork for shipment soon.</p>
        
        <a href="/" class="inline-block bg-stone-900 text-white px-6 py-2.5 rounded text-sm font-medium hover:bg-stone-700 transition">
            Return to Gallery
        </a>
    </div>

</body>
</html>
